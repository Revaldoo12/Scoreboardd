  <style>
:root {
  --red: #ff3b1f;
  --amber: #ffb300;
  --off: rgba(255, 255, 255, 0.05);   /* segmen LED yang mati */

  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --label: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0e0e;
  color: #eee;
  font-family: var(--ui);
}

.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 32px; }

/* ================= HEADER / PROFILE EVENT ================= */
.event {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 18px;
  padding: 14px 18px;
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
}

.event-text {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
}

.event-title {
  width: 100%;
  padding: 2px 6px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #f2f2f2;
  font: 700 clamp(20px, 3vw, 32px) var(--label);
  font-stretch: condensed;
  letter-spacing: 0.06em;
  text-align: center;
  text-transform: uppercase;
}
.event-sub {
  width: 100%;
  padding: 1px 6px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #9a9a9a;
  font: 600 clamp(12px, 1.6vw, 15px) var(--label);
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}
.event-title:hover, .event-sub:hover { border-color: #333; }
.event-title:focus, .event-sub:focus { outline: none; border-color: #777; background: #0b0b0b; }
.event-sub:placeholder-shown { color: #555; }

@media (max-width: 760px) {
  .event { gap: 12px; padding: 12px 14px; }
}

/* ================= PAPAN SKOR ================= */
.board {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "home middle away";
  gap: 24px 32px;
  align-items: start;
  padding: 28px 32px;
  background: #151515;
  border: 1px solid #2a2a2a;
  border-top-color: #353535;
  border-radius: 8px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}
.home   { grid-area: home; }
.middle { grid-area: middle; }
.away   { grid-area: away; }

.side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.team-name {
  width: 100%;
  padding: 2px 4px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  color: #f2f2f2;
  font: 700 clamp(18px, 2.4vw, 30px) var(--label);
  font-stretch: condensed;
  letter-spacing: 0.04em;
  text-align: center;
  text-transform: uppercase;
}
.team-name:hover { border-bottom-color: #444; }
.team-name:focus { outline: none; border-bottom-color: #888; }

.cap {
  color: #cfcfcf;
  font: 700 13px var(--label);
  font-stretch: condensed;
  letter-spacing: 0.08em;
}

.panel {
  display: inline-flex;
  justify-content: center;
  padding: 12px 16px;
  background: #050505;
  border: 1px solid #262626;
  border-radius: 4px;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
}
.panel.small { padding: 8px 10px; }

.sub { display: flex; align-items: center; gap: 10px; }

.lamp {
  padding: 3px 6px;
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  color: #3a3a3a;
  font: 700 11px var(--label);
  letter-spacing: 0.06em;
}
.lamp.on { color: #111; background: var(--amber); border-color: var(--amber); }

.middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.period-row { display: flex; align-items: center; gap: 18px; }
.period-unit { display: flex; align-items: center; gap: 10px; }
.shot-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }

/* panah penguasaan bola */
.arrow {
  width: 0;
  height: 0;
  border-top: 13px solid transparent;
  border-bottom: 13px solid transparent;
}
.arrow.left  { border-right: 20px solid #2a2a2a; }
.arrow.right { border-left: 20px solid #2a2a2a; }
.arrow.left.on  { border-right-color: var(--amber); }
.arrow.right.on { border-left-color: var(--amber); }

/* ================= DIGIT 7-SEGMEN ================= */
/* Semua ukuran pakai em, jadi cukup ubah font-size untuk mengubah besar digit */
.led {
  --on: var(--red);
  display: inline-flex;
  align-items: center;
  gap: 0.1em;
  transform: skewX(-5deg);
}
.led.amber { --on: var(--amber); }

.led-score { font-size: clamp(56px, 9vw, 128px); }
.led-clock { font-size: clamp(52px, 8vw, 112px); }
.led-shot  { font-size: clamp(44px, 6vw, 80px); }
.led-small { font-size: clamp(28px, 3vw, 42px); }

.dg { position: relative; flex: none; width: 0.54em; height: 1em; }

.dg i { position: absolute; background: var(--off); }
.dg i.on, .sep i.on {
  background: var(--on);
  box-shadow: 0 0 0.08em color-mix(in srgb, var(--on) 45%, transparent);
}

/* segmen horizontal: a (atas), g (tengah), d (bawah) */
.sa, .sg, .sd {
  left: 0.05em;
  right: 0.05em;
  height: 0.1em;
  clip-path: polygon(0.05em 0, calc(100% - 0.05em) 0, 100% 50%, calc(100% - 0.05em) 100%, 0.05em 100%, 0 50%);
}
.sa { top: 0; }
.sg { top: 0.45em; }
.sd { bottom: 0; }

/* segmen vertikal: f (kiri atas), b (kanan atas), e (kiri bawah), c (kanan bawah) */
.sf, .sb, .se, .sc {
  width: 0.1em;
  height: 0.45em;
  clip-path: polygon(50% 0, 100% 0.05em, 100% calc(100% - 0.05em), 50% 100%, 0 calc(100% - 0.05em), 0 0.05em);
}
.sf { left: 0;  top: 0.05em; }
.sb { right: 0; top: 0.05em; }
.se { left: 0;  bottom: 0.05em; }
.sc { right: 0; bottom: 0.05em; }

/* titik dua & titik desimal */
.sep { position: relative; flex: none; width: 0.2em; height: 1em; }
.sep i {
  position: absolute;
  left: 0.05em;
  width: 0.1em;
  height: 0.1em;
  border-radius: 50%;
  background: var(--off);
}
.colon i:first-child { top: 0.28em; }
.colon i:last-child  { top: 0.64em; }
.dot i { bottom: 0; }

/* ================= PANEL OPERATOR ================= */
.console {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 16px;
  margin-top: 20px;
}

.group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
  background: #1b1b1b;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
}

.group h2 {
  margin-bottom: 2px;
  color: #9a9a9a;
  font: 700 13px var(--label);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.row { display: grid; gap: 8px; }
.row.two   { grid-template-columns: 1fr 1fr; }
.row.three { grid-template-columns: repeat(3, 1fr); }

.console button {
  padding: 12px 8px;
  background: #2a2a2a;
  border: 1px solid #3a3a3a;
  border-radius: 5px;
  color: #eee;
  font: 600 15px var(--ui);
  cursor: pointer;
}
.console button:hover  { background: #333; }
.console button:active { background: #222; transform: translateY(1px); }

.console .pts { font-size: 20px; font-weight: 700; }

.console .muted { background: transparent; color: #bbb; }
.console .muted:hover { background: #242424; }
.console .danger:hover { border-color: #a33; color: #f66; }

.console .big { padding: 16px; font-size: 18px; letter-spacing: 0.04em; }
.console .go   { background: #2f7d32; border-color: #2f7d32; color: #fff; }
.console .go:hover { background: #358f39; }
.console .stop { background: #b23a2a; border-color: #b23a2a; color: #fff; }
.console .stop:hover { background: #c4402e; }

/* tampilkan Start ATAU Stop */
#btn-pause { display: none; }
body.is-running #btn-start { display: none; }
body.is-running #btn-pause { display: block; }

/* ================= PENGATURAN WAKTU ================= */
.settings {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 16px;
  padding: 12px 14px;
  background: #1b1b1b;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
}

.set-label {
  color: #9a9a9a;
  font: 700 13px var(--label);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.time-input { display: flex; align-items: center; gap: 4px; color: #888; font-size: 20px; }
.time-input input {
  width: 64px;
  padding: 8px 6px;
  background: #050505;
  border: 1px solid #3a3a3a;
  border-radius: 5px;
  color: var(--amber);
  font: 700 22px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  text-align: center;
  -moz-appearance: textfield;
}
.time-input input::-webkit-outer-spin-button,
.time-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.time-input input:focus { outline: none; border-color: var(--amber); }

.settings button {
  padding: 9px 12px;
  background: #2a2a2a;
  border: 1px solid #3a3a3a;
  border-radius: 5px;
  color: #eee;
  font: 600 14px var(--ui);
  cursor: pointer;
}
.settings button:hover { background: #333; }
.settings .apply { background: #e0a000; border-color: #e0a000; color: #111; }
.settings .apply:hover { background: #f0b000; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { background: transparent; color: #bbb; }
.presets button.active { border-color: var(--amber); color: var(--amber); }

.set-msg { color: #888; font-size: 13px; }
.set-msg.err { color: #f66; }

.keys {
  margin-top: 14px;
  color: #777;
  font-size: 13px;
  text-align: center;
}
kbd {
  padding: 1px 6px;
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 4px;
  color: #bbb;
  font: 12px var(--ui);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 760px) {
  .wrap { padding: 12px 10px 24px; }
  .board {
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "middle middle"
      "home   away";
    padding: 20px 14px;
    gap: 20px 12px;
  }
  .sub { flex-wrap: wrap; justify-content: center; }

  .console { grid-template-columns: 1fr 1fr; }
  .console .main { grid-column: 1 / -1; order: -1; }
  .keys { display: none; }
}

<body>
  <div class="wrap">

    <!-- ===== HEADER / PROFILE EVENT ===== -->
    <header class="event" id="event-header">
      <div class="event-text">
        <input class="event-title" id="event-title" value="NAMA EVENT" maxlength="40"
               placeholder="Nama event" aria-label="Judul event" />
        <input class="event-sub" id="event-sub" value="" maxlength="50"
               placeholder="Subjudul (opsional)" aria-label="Subjudul event" />
      </div>
    </header>

    <!-- ===== PAPAN SKOR ===== -->
    <div class="board">
      <section class="side home">
        <input class="team-name" data-team="home" value="HOME" maxlength="12" aria-label="Nama tim home" />
        <div class="panel"><div class="led red led-score" id="score-home"></div></div>
        <div class="sub">
          <span class="cap">FOULS</span>
          <div class="panel small"><div class="led amber led-small" id="foul-home"></div></div>

        </div>

      <section class="middle">
        <div class="panel"><div class="led amber led-clock" id="game-clock"></div></div>

        <div class="period-row">
          <span class="arrow left" id="poss-home" title="Bola: home"></span>
          <div class="period-unit">
            <span class="cap">PERIOD</span>
            <div class="panel small"><div class="led amber led-small" id="period"></div></div>
            <span class="lamp" id="ot-lamp">OT</span>
          </div>
          <span class="arrow right" id="poss-away" title="Bola: guest"></span>

      <section class="side away">
        <input class="team-name" data-team="away" value="GUEST" maxlength="12" aria-label="Nama tim guest" />

        <div class="sub">
          <span class="lamp" id="penalty-away">BONUS</span>

          <span class="cap">FOULS</span>

    </div>

    <!-- ===== PANEL OPERATOR ===== -->
    <div class="console">
      <div class="group">
        <h2 id="label-home">HOME</h2>
        <div class="row three">
          <button class="pts" data-team="home" data-pts="1">+1</button>
          <button class="pts" data-team="home" data-pts="2">+2</button>
          <button class="pts" data-team="home" data-pts="3">+3</button>

        <div class="row three">
          <button class="muted" data-team="home" data-pts="-1">−1</button>

          <button class="muted" data-foul="home" data-delta="-1">Foul −</button>

      <div class="group main">
        <h2>Timer</h2>
        <button id="btn-start" class="big go">Start</button>
        <button id="btn-pause" class="big stop">Stop</button>
        <div class="row two">
          <button id="btn-shot-24">Shot 24</button>
          <button id="btn-shot-14">Shot 14</button>
        </div>
        <div class="row three">
          <button data-period="-1">Period −</button>
          <button id="btn-poss">Position ⇄</button>
          <button data-period="1">Period +</button>
        </div>
        <div class="row two">
          <button id="btn-reset-game" class="muted">Reset Timer</button>
          <button id="btn-reset-all" class="muted danger">Reset All</button>

      <div class="group">
        <h2 id="label-away">GUEST</h2>

          <button class="muted" data-team="away" data-pts="-1">−1</button>
          <button data-foul="away" data-delta="1">Foul +</button>

    <!-- ===== PENGATURAN WAKTU ===== -->

    <p class="keys">

  <script>
// ====== Konfigurasi ======
const CONFIG = {
  periodMs: loadPeriodMs(), // durasi per periode (bisa diubah di panel "Durasi periode")
  shotSeconds: 24,   // shot clock penuh
  shotReset14: 14,   // reset setelah offensive rebound
  penaltyFouls: 4,   // FIBA: setelah 4 team foul, foul berikutnya = lemparan bebas
};

// Durasi periode disimpan di browser supaya tetap ada setelah refresh
function loadPeriodMs() {
  const saved = Number(localStorage.getItem("periodMs"));
  return saved > 0 ? saved : 10 * 60 * 1000; // default 10 menit
}

// ====== State ======
const state = {
  gameMs: CONFIG.periodMs,
  shotMs: CONFIG.shotSeconds * 1000,
  running: false,
  period: 1,
  score: { home: 0, away: 0 },
  fouls: { home: 0, away: 0 },
  possession: null, // "home" | "away" | null
  lastTick: null,
};

const $ = (id) => document.getElementById(id);

const el = {
  gameClock: $("game-clock"),
  shotClock: $("shot-clock"),
  period: $("period"),
  otLamp: $("ot-lamp"),
  score: { home: $("score-home"), away: $("score-away") },
  fouls: { home: $("foul-home"), away: $("foul-away") },
  penalty: { home: $("penalty-home"), away: $("penalty-away") },
  poss: { home: $("poss-home"), away: $("poss-away") },
  label: { home: $("label-home"), away: $("label-away") },
};

// ====== Digit LED 7-segmen ======
// Segmen: a = atas, b = kanan atas, c = kanan bawah, d = bawah,
//         e = kiri bawah, f = kiri atas, g = tengah
const SEGMENTS = {
  "0": "abcdef", "1": "bc", "2": "abdeg", "3": "abcdg", "4": "bcfg",
  "5": "acdfg", "6": "acdefg", "7": "abc", "8": "abcdefg", "9": "abcdfg",
  " ": "",
};

function digitHTML(ch) {
  const lit = SEGMENTS[ch] ?? "";
  const segs = "abcdefg"
    .split("")
    .map((s) => `<i class="s${s}${lit.includes(s) ? " on" : ""}"></i>`)
    .join("");
  return `<span class="dg">${segs}</span>`;
}

function sepHTML(ch) {
  if (ch === ":") return `<span class="sep colon"><i class="on"></i><i class="on"></i></span>`;
  return `<span class="sep dot"><i class="on"></i></span>`;
}

// Tulis teks ke LED. `digits` = jumlah digit tetap; sisa kiri diisi digit mati.
function setLed(node, text, digits) {
  const count = (text.match(/\d/g) || []).length;
  const padded = " ".repeat(Math.max(0, digits - count)) + text;
  if (node.dataset.text === padded) return; // tidak berubah, lewati
  node.dataset.text = padded;
  node.innerHTML = [...padded].map((ch) => (ch === ":" || ch === "." ? sepHTML(ch) : digitHTML(ch))).join("");
}

// ====== Buzzer ======
// Kalau ada file buzzer.mp3 di folder ini, itu yang diputar.
// Kalau tidak ada, pakai bunyi sintetis yang mirip buzzer basket.
let audioCtx = null;
const buzzerFile = new Audio("buzzer.mp3");
buzzerFile.preload = "auto";

function playBuzzer(duration = 1.2) {
  buzzerFile.currentTime = 0;
  const p = buzzerFile.play();
  if (p && typeof p.then === "function") p.catch(() => synthBuzzer(duration));
}

function synthBuzzer(duration = 1.2) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
    gain.gain.setValueAtTime(0.35, now + duration - 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    gain.connect(audioCtx.destination);

    [200, 100].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.value = i === 0 ? 1 : 0.5;
      osc.connect(g);
      g.connect(gain);
      osc.start(now);
      osc.stop(now + duration);
    });
  } catch (e) { /* audio tidak didukung */ }
}

// ====== Format waktu ======
function formatGame(ms) {
  const sec = Math.max(0, ms) / 1000;
  if (sec < 60) return (Math.floor(sec * 10) / 10).toFixed(1); // 59.9 ... 0.0
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function formatShot(ms) {
  const sec = Math.max(0, ms) / 1000;
  if (sec < 5) return (Math.floor(sec * 10) / 10).toFixed(1); // 4.9 ... 0.0
  return String(Math.ceil(sec));
}

// ====== Render ======
function render() {
  setLed(el.gameClock, formatGame(state.gameMs), 4);
  setLed(el.shotClock, formatShot(state.shotMs), 2);

  const isOT = state.period > 4;
  setLed(el.period, String(isOT ? state.period - 4 : state.period), 1);
  el.otLamp.classList.toggle("on", isOT);

  ["home", "away"].forEach((team) => {
    setLed(el.score[team], String(state.score[team]), 3);
    setLed(el.fouls[team], String(Math.min(state.fouls[team], 9)), 1);
    el.penalty[team].classList.toggle("on", state.fouls[team] >= CONFIG.penaltyFouls);
    el.poss[team].classList.toggle("on", state.possession === team);
  });

  document.body.classList.toggle("is-running", state.running);
}

// ====== Loop timer ======
function tick(now) {
  if (!state.running) return;
  if (state.lastTick == null) state.lastTick = now;
  const delta = now - state.lastTick;
  state.lastTick = now;

  state.gameMs -= delta;
  state.shotMs -= delta;

  if (state.gameMs <= 0) {
    state.gameMs = 0;
    playBuzzer(1.5); // akhir periode
    pause();
  } else if (state.shotMs <= 0) {
    state.shotMs = 0;
    playBuzzer(0.9); // shot clock violation
    pause();
  }

  render();
  if (state.running) requestAnimationFrame(tick);
}

// ====== Kontrol ======
function start() {
  if (state.running || state.gameMs <= 0) return;
  if (state.shotMs <= 0) state.shotMs = CONFIG.shotSeconds * 1000;
  state.running = true;
  state.lastTick = null;
  render();
  requestAnimationFrame(tick);
}

function pause() {
  state.running = false;
  state.lastTick = null;
  render();
}

function resetShot(seconds) {
  state.shotMs = seconds * 1000;
  render();
}

function resetGameClock() {
  state.gameMs = CONFIG.periodMs;
  state.shotMs = CONFIG.shotSeconds * 1000;
  render();
}

function togglePossession() {
  state.possession = state.possession === "home" ? "away" : "home";
  render();
}

function resetAll() {
  if (!confirm("Reset semua skor, foul, periode, dan jam?")) return;
  state.running = false;
  state.lastTick = null;
  state.gameMs = CONFIG.periodMs;
  state.shotMs = CONFIG.shotSeconds * 1000;
  state.period = 1;
  state.score = { home: 0, away: 0 };
  state.fouls = { home: 0, away: 0 };
  state.possession = null;
  render();
}

// ====== Event ======
$("btn-start").addEventListener("click", start);
$("btn-pause").addEventListener("click", pause);
$("btn-shot-24").addEventListener("click", () => resetShot(CONFIG.shotSeconds));
$("btn-shot-14").addEventListener("click", () => resetShot(CONFIG.shotReset14));
$("btn-reset-game").addEventListener("click", resetGameClock);
$("btn-reset-all").addEventListener("click", resetAll);
$("btn-poss").addEventListener("click", togglePossession);

document.querySelectorAll("[data-pts]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const team = btn.dataset.team;
    state.score[team] = Math.max(0, Math.min(999, state.score[team] + Number(btn.dataset.pts)));
    render();
  });
});

document.querySelectorAll("[data-foul]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const team = btn.dataset.foul;
    state.fouls[team] = Math.max(0, state.fouls[team] + Number(btn.dataset.delta));
    render();
  });
});

document.querySelectorAll("[data-period]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.period = Math.max(1, state.period + Number(btn.dataset.period));
    render();
  });
});

// nama tim di papan ikut tampil di panel operator
document.querySelectorAll(".team-name").forEach((input) => {
  const sync = () => { el.label[input.dataset.team].textContent = input.value || "—"; };
  input.addEventListener("input", sync);
  sync();
});

// ====== Pengaturan durasi periode ======
const setMin = $("set-min");
const setSec = $("set-sec");
const setMsg = $("set-msg");
const presetBtns = document.querySelectorAll("[data-preset]");

function showDurationInputs(ms) {
  const total = Math.round(ms / 1000);
  setMin.value = Math.floor(total / 60);
  setSec.value = String(total % 60).padStart(2, "0");
  presetBtns.forEach((b) => b.classList.toggle("active", Number(b.dataset.preset) * 60 === total));
}

function message(text, isError = false) {
  setMsg.textContent = text;
  setMsg.classList.toggle("err", isError);
}

function applyDuration(minutes, seconds) {
  if (state.running) return message("Stop jam dulu sebelum mengubah durasi.", true);

  const m = Math.floor(Number(minutes));
  const s = Math.floor(Number(seconds));
  if (!Number.isFinite(m) || !Number.isFinite(s) || m < 0 || m > 99 || s < 0 || s > 59) {
    return message("Isi menit 0–99 dan detik 0–59.", true);
  }
  const ms = (m * 60 + s) * 1000;
  if (ms <= 0) return message("Durasi minimal 1 detik.", true);

  CONFIG.periodMs = ms;
  localStorage.setItem("periodMs", String(ms));
  state.gameMs = ms;
  state.shotMs = CONFIG.shotSeconds * 1000;
  showDurationInputs(ms);
  message(`Jam diatur ke ${m}:${String(s).padStart(2, "0")}.`);
  render();
}

$("time-form").addEventListener("submit", (e) => {
  e.preventDefault();
  applyDuration(setMin.value, setSec.value);
});

presetBtns.forEach((btn) => {
  btn.addEventListener("click", () => applyDuration(btn.dataset.preset, 0));
});

showDurationInputs(CONFIG.periodMs);

// ====== Header / profile event ======
const eventTitle = $("event-title");
const eventSub = $("event-sub");

// judul tab browser ikut nama event
function updateDocTitle() {
  const t = eventTitle.value.trim();
  const s = eventSub.value.trim();
  document.title = t ? (s ? `${t} — ${s}` : t) : "Scoreboard Basket";
}

// teks (judul + subjudul) disimpan di browser
function saveEventText() {
  localStorage.setItem("eventTitle", eventTitle.value);
  localStorage.setItem("eventSub", eventSub.value);
  updateDocTitle();
}

function loadEventText() {
  const t = localStorage.getItem("eventTitle");
  const s = localStorage.getItem("eventSub");
  if (t !== null) eventTitle.value = t;
  if (s !== null) eventSub.value = s;
  updateDocTitle();
}

eventTitle.addEventListener("input", saveEventText);
eventSub.addEventListener("input", saveEventText);

// bersihkan logo lama yang mungkin tersimpan dari versi sebelumnya
localStorage.removeItem("eventLogo");

// muat data tersimpan saat halaman dibuka
loadEventText();

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); state.running ? pause() : start(); }
  else if (k === "z") resetShot(CONFIG.shotSeconds);
  else if (k === "x") resetShot(CONFIG.shotReset14);
  else if (k === "p") togglePossession();
});

render();

  </script>
</body>
</html>
